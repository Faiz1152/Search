<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Search</title>
<style>
  :root {
    color-scheme: light;
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f6f7f9;
    --text:#202124;
    --muted:#5f6368;
    --border:#dadce0;
    --accent:#1a73e8;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.06);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#111315;
    --surface:#17191c;
    --surface-2:#202328;
    --text:#e8eaed;
    --muted:#aeb4bc;
    --border:#34383f;
    --accent:#8ab4f8;
    --shadow:0 2px 8px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
  button,input { font:inherit; }
  body { min-height:100vh; }
  .page { min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:flex-end; align-items:center; padding:14px 20px; gap:10px; }
  .theme-wrap { position:relative; }
  .icon-btn {
    width:42px; height:42px; border:1px solid transparent; border-radius:50%;
    background:transparent; color:var(--text); cursor:pointer; font-size:20px;
  }
  .icon-btn:hover,.icon-btn:focus-visible { background:var(--surface-2); outline:none; }
  .theme-menu {
    position:absolute; right:0; top:48px; z-index:20; width:150px; padding:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); display:none;
  }
  .theme-menu.open { display:block; }
  .theme-option {
    width:100%; border:0; background:transparent; color:var(--text);
    text-align:left; padding:10px 12px; border-radius:8px; cursor:pointer;
  }
  .theme-option:hover { background:var(--surface-2); }
  .theme-option.active { background:var(--surface-2); font-weight:700; }

  main { width:min(100%,980px); margin:auto; padding:7vh 20px 50px; }
  .hero { display:flex; flex-direction:column; align-items:center; margin-bottom:38px; }
  .logo { font-size:64px; line-height:1; margin-bottom:26px; user-select:none; }
  .search-form { width:min(100%,720px); position:relative; }
  .search-box {
    width:100%; height:56px; border:1px solid var(--border); border-radius:30px;
    background:var(--surface); color:var(--text); padding:0 58px 0 52px;
    outline:none; box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .search-box:hover,.search-box:focus { box-shadow:0 2px 8px rgba(0,0,0,.13); border-color:transparent; }
  .search-icon { position:absolute; left:19px; top:17px; font-size:20px; color:var(--muted); pointer-events:none; }
  .submit-btn {
    position:absolute; right:7px; top:7px; width:42px; height:42px; border:0;
    border-radius:50%; background:var(--accent); color:white; cursor:pointer; font-size:19px;
  }
  .submit-btn:disabled { opacity:.55; cursor:default; }
  .suggestions {
    position:absolute; left:0; right:0; top:62px; z-index:10; overflow:hidden;
    border:1px solid var(--border); border-radius:14px; background:var(--surface);
    box-shadow:var(--shadow); display:none;
  }
  .suggestion { padding:12px 18px; cursor:pointer; display:flex; gap:10px; }
  .suggestion:hover,.suggestion.selected { background:var(--surface-2); }

  .results-area { width:min(100%,820px); margin:auto; }
  .toolbar { display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow:auto; }
  .tab {
    border:0; background:transparent; color:var(--muted); padding:11px 13px;
    cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
  }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
  .status { color:var(--muted); padding:22px 4px; text-align:center; }
  .error { color:#c5221f; }
  .result {
    padding:18px 0; border-bottom:1px solid var(--border);
  }
  .result-top { display:flex; gap:16px; }
  .result-main { flex:1; min-width:0; }
  .result-title {
    display:block; color:var(--accent); font-size:19px; line-height:1.35;
    text-decoration:none; font-weight:600; margin-bottom:5px; overflow-wrap:anywhere;
  }
  .result-title:hover { text-decoration:underline; }
  .result-url { color:var(--muted); font-size:13px; margin-bottom:7px; overflow-wrap:anywhere; }
  .result-desc { color:var(--text); line-height:1.55; font-size:14px; }
  .result-meta { color:var(--muted); font-size:12px; margin-top:8px; }
  .thumb {
    width:120px; height:82px; object-fit:cover; border-radius:10px;
    border:1px solid var(--border); background:var(--surface-2); flex:none;
  }
  .special-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:17px; box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card h2 { margin:0 0 9px; font-size:17px; }
  .card p { margin:5px 0; line-height:1.45; }
  .muted { color:var(--muted); }
  .image-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
  .image-card { border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); text-decoration:none; color:var(--text); }
  .image-card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .image-card div { padding:9px; font-size:13px; line-height:1.35; }
  .video-list { display:grid; gap:10px; margin-bottom:20px; }
  .video-card { display:flex; gap:14px; padding:12px; border:1px solid var(--border); border-radius:12px; text-decoration:none; color:var(--text); background:var(--surface); }
  .video-card img { width:150px; height:84px; object-fit:cover; border-radius:8px; flex:none; }
  .video-card strong { display:block; margin-bottom:6px; }
  .pill { display:inline-block; font-size:12px; color:var(--muted); padding:4px 8px; border:1px solid var(--border); border-radius:20px; margin-top:5px; }

  .map-list { display:grid; gap:10px; }
  .place { padding:13px 0; border-top:1px solid var(--border); }
  .place:first-child { border-top:0; }
  .place-name { font-weight:700; }
  .place-address { color:var(--muted); margin-top:4px; font-size:13px; }
  .map-link { display:inline-block; margin-top:7px; color:var(--accent); text-decoration:none; font-size:13px; }
  .map-link:hover { text-decoration:underline; }

  .footer-note { color:var(--muted); text-align:center; font-size:12px; padding:25px 0; }

  @media (max-width:700px) {
    header { padding:10px 12px; }
    main { padding:5vh 14px 35px; }
    .logo { font-size:54px; margin-bottom:22px; }
    .search-box { height:52px; }
    .submit-btn { width:38px; height:38px; }
    .search-icon { top:15px; }
    .special-grid { grid-template-columns:1fr; }
    .image-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .result-top { flex-direction:column-reverse; }
    .thumb { width:100%; height:180px; }
    .video-card img { width:115px; height:70px; }
  }
  @media (prefers-reduced-motion:reduce) {
    * { scroll-behavior:auto !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="theme-wrap">
      <button class="icon-btn" id="themeButton" aria-label="Theme" aria-haspopup="menu" aria-expanded="false">◐</button>
      <div class="theme-menu" id="themeMenu" role="menu">
        <button class="theme-option" data-theme-choice="system" role="menuitem">System</button>
        <button class="theme-option" data-theme-choice="light" role="menuitem">Light</button>
        <button class="theme-option" data-theme-choice="dark" role="menuitem">Dark</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="logo" aria-label="Search">🔍</div>
      <form class="search-form" id="searchForm" autocomplete="off">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" class="search-box" type="search" placeholder="Search the web" aria-label="Search the web" spellcheck="false">
        <button class="submit-btn" id="submitButton" type="submit" aria-label="Search">➜</button>
        <div class="suggestions" id="suggestions" role="listbox"></div>
      </form>
    </section>

    <section class="results-area" id="resultsArea" aria-live="polite"></section>
  </main>
</div>

<script>
/* ============================================================
   API KEY
   Replace ONLY the word UNDICLOSED below with your API key.
   Do not change anything else in this line.
   ============================================================ */
const API_KEY = "ezGeMU9TnuXNnmytZSSScsbL";

/* ============================================================
   API configuration
   ============================================================ */
const API_URL = "https://serpapi.com/search";

const state = {
  query: "",
  data: null,
  type: "web",
  theme: localStorage.getItem("theme-preference") || "system"
};

const root = document.documentElement;
const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");
const submitButton = document.getElementById("submitButton");
const resultsArea = document.getElementById("resultsArea");
const suggestions = document.getElementById("suggestions");
const themeButton = document.getElementById("themeButton");
const themeMenu = document.getElementById("themeMenu");
const media = window.matchMedia("(prefers-color-scheme: dark)");

function applyTheme() {
  const pref = state.theme;
  const dark = pref === "dark" || (pref === "system" && media.matches);
  root.dataset.theme = dark ? "dark" : "light";

  document.querySelectorAll(".theme-option").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.themeChoice === pref);
  });
}

function setTheme(pref) {
  state.theme = pref;
  localStorage.setItem("theme-preference", pref);
  applyTheme();
  themeMenu.classList.remove("open");
  themeButton.setAttribute("aria-expanded", "false");
}

applyTheme();

if (media.addEventListener) {
  media.addEventListener("change", () => {
    if (state.theme === "system") applyTheme();
  });
} else if (media.addListener) {
  media.addListener(() => {
    if (state.theme === "system") applyTheme();
  });
}

themeButton.addEventListener("click", () => {
  const open = themeMenu.classList.toggle("open");
  themeButton.setAttribute("aria-expanded", String(open));
});

document.querySelectorAll(".theme-option").forEach(btn => {
  btn.addEventListener("click", () => setTheme(btn.dataset.themeChoice));
});

document.addEventListener("click", e => {
  if (!e.target.closest(".theme-wrap")) {
    themeMenu.classList.remove("open");
    themeButton.setAttribute("aria-expanded", "false");
  }
});

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function safeURL(value) {
  try {
    const u = new URL(value);
    if (u.protocol === "http:" || u.protocol === "https:") return u.href;
  } catch {}
  return "";
}

function hostFromURL(value) {
  try { return new URL(value).hostname; } catch { return ""; }
}

function showStatus(text, isError = false) {
  resultsArea.innerHTML = `<div class="status ${isError ? "error" : ""}">${escapeHTML(text)}</div>`;
}

function setLoading(loading) {
  submitButton.disabled = loading;
  submitButton.textContent = loading ? "…" : "➜";
}

function getResults(data) {
  return Array.isArray(data?.results) ? data.results : [];
}

function getFeature(data, key) {
  return data?.features?.[key];
}

function getAvailability(data, key) {
  return data?.featureAvailability?.[key] === true;
}

function renderTabs(data) {
  const tabs = [
    ["web", "Web"],
    ["images", "Images"],
    ["news", "News"],
    ["videos", "Videos"]
  ];

  const available = tabs.filter(([key]) => {
    if (key === "web") return true;
    return getAvailability(data, key) || Array.isArray(getFeature(data, key));
  });

  return `<nav class="toolbar" aria-label="Search types">
    ${available.map(([key, label]) =>
      `<button class="tab ${state.type === key ? "active" : ""}" data-type="${key}">${label}</button>`
    ).join("")}
  </nav>`;
}

function renderSpecialCards(data) {
  const cards = [];

  if (getAvailability(data, "answerBox") && getFeature(data, "answerBox")) {
    const a = getFeature(data, "answerBox");
    cards.push(`
      <article class="card">
        <h2>${escapeHTML(a.title || "Answer")}</h2>
        ${a.answer ? `<p>${escapeHTML(a.answer)}</p>` : ""}
        ${a.snippet ? `<p>${escapeHTML(a.snippet)}</p>` : ""}
      </article>
    `);
  }

  if (getAvailability(data, "knowledgeGraph") && getFeature(data, "knowledgeGraph")) {
    const k = getFeature(data, "knowledgeGraph");
    cards.push(`
      <article class="card">
        <h2>${escapeHTML(k.title || k.name || "Information")}</h2>
        ${k.type ? `<p class="muted">${escapeHTML(k.type)}</p>` : ""}
        ${k.description ? `<p>${escapeHTML(k.description)}</p>` : ""}
      </article>
    `);
  }

  if (getAvailability(data, "calculator") && getFeature(data, "calculator")) {
    const c = getFeature(data, "calculator");
    cards.push(`
      <article class="card">
        <h2>Calculator</h2>
        <p style="font-size:24px;font-weight:700">${escapeHTML(c.result || c.answer || "")}</p>
        ${c.expression ? `<p class="muted">${escapeHTML(c.expression)}</p>` : ""}
      </article>
    `);
  }

  if (getAvailability(data, "weather") && getFeature(data, "weather")) {
    const w = getFeature(data, "weather");
    cards.push(`
      <article class="card">
        <h2>${escapeHTML(w.location || w.city || "Weather")}</h2>
        ${w.temperature ? `<p style="font-size:24px;font-weight:700">${escapeHTML(w.temperature)}</p>` : ""}
        ${w.description ? `<p>${escapeHTML(w.description)}</p>` : ""}
      </article>
    `);
  }

  if (getAvailability(data, "finance") && getFeature(data, "finance")) {
    const f = getFeature(data, "finance");
    const items = Array.isArray(f) ? f : [f];
    const useful = items.slice(0, 4);
    cards.push(`
      <article class="card">
        <h2>Finance</h2>
        ${useful.map(item => `
          <p><strong>${escapeHTML(item.name || item.symbol || item.ticker || "")}</strong>
          ${item.price != null ? ` — ${escapeHTML(item.price)}` : ""}
          ${item.change != null ? ` <span class="muted">${escapeHTML(item.change)}</span>` : ""}</p>
        `).join("")}
      </article>
    `);
  }

  return cards.length ? `<div class="special-grid">${cards.join("")}</div>` : "";
}

function renderMap(data) {
  if (!getAvailability(data, "map")) return "";

  const map = getFeature(data, "map");
  const places = Array.isArray(map?.results) ? map.results : [];

  if (!places.length) return "";

  return `
    <article class="card" style="margin-bottom:18px">
      <h2>Places</h2>
      <div class="map-list">
        ${places.slice(0, 8).map(place => {
          const name = place.title || place.name || "Place";
          const address = place.address || "";
          const gps = place.gps_coordinates;
          let mapURL = "";

          if (gps && Number.isFinite(Number(gps.latitude)) && Number.isFinite(Number(gps.longitude))) {
            mapURL = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(Number(gps.latitude) + "," + Number(gps.longitude))}`;
          } else if (address) {
            mapURL = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
          }

          return `
            <div class="place">
              <div class="place-name">${escapeHTML(name)}</div>
              ${address ? `<div class="place-address">${escapeHTML(address)}</div>` : ""}
              ${mapURL ? `<a class="map-link" href="${escapeHTML(mapURL)}" target="_blank" rel="noopener noreferrer">Open in Maps ↗</a>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    </article>
  `;
}

function renderImages(data) {
  const items = Array.isArray(getFeature(data, "images")) ? getFeature(data, "images") : [];
  if (!items.length) return "";

  return `
    <div class="image-grid">
      ${items.slice(0, 24).map(item => {
        const image = safeURL(item.original || item.thumbnail || item.image);
        const link = safeURL(item.link || item.source || image);
        if (!image) return "";
        return `
          <a class="image-card" href="${escapeHTML(link || image)}" target="_blank" rel="noopener noreferrer">
            <img src="${escapeHTML(image)}" alt="${escapeHTML(item.title || "Image")}" loading="lazy" referrerpolicy="no-referrer">
            <div>${escapeHTML(item.title || item.source || "")}</div>
          </a>
        `;
      }).join("")}
    </div>
  `;
}

function renderVideos(data) {
  const items = Array.isArray(getFeature(data, "videos")) ? getFeature(data, "videos") : [];
  if (!items.length) return "";

  return `
    <div class="video-list">
      ${items.slice(0, 15).map(item => {
        const link = safeURL(item.link || item.url);
        const image = safeURL(item.thumbnail || item.image);
        if (!link) return "";
        return `
          <a class="video-card" href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer">
            ${image ? `<img src="${escapeHTML(image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
            <div>
              <strong>${escapeHTML(item.title || "Video")}</strong>
              ${item.snippet ? `<div class="muted">${escapeHTML(item.snippet)}</div>` : ""}
              ${item.source ? `<span class="pill">${escapeHTML(item.source)}</span>` : ""}
            </div>
          </a>
        `;
      }).join("")}
    </div>
  `;
}

function renderWebResults(results) {
  if (!results.length) {
    return `<div class="status">No results found.</div>`;
  }

  return results.map(item => {
    const link = safeURL(item.url);
    if (!link) return "";

    const thumb = safeURL(item.thumbnail);

    return `
      <article class="result">
        <div class="result-top">
          <div class="result-main">
            <a class="result-title" href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer">
              ${escapeHTML(item.title || "Untitled result")}
            </a>
            <div class="result-url">${escapeHTML(item.displayUrl || hostFromURL(link))}</div>
            ${item.description ? `<div class="result-desc">${escapeHTML(item.description)}</div>` : ""}
            ${(item.source || item.date) ? `<div class="result-meta">${escapeHTML([item.source, item.date].filter(Boolean).join(" · "))}</div>` : ""}
          </div>
          ${thumb ? `<img class="thumb" src="${escapeHTML(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
        </div>
      </article>
    `;
  }).join("");
}

function renderNews(data) {
  const items = Array.isArray(getFeature(data, "news")) ? getFeature(data, "news") : [];
  if (!items.length) return renderWebResults(getResults(data));

  return items.slice(0, 30).map(item => {
    const link = safeURL(item.link || item.url);
    if (!link) return "";
    const image = safeURL(item.thumbnail || item.image);
    return `
      <article class="result">
        <div class="result-top">
          <div class="result-main">
            <a class="result-title" href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer">${escapeHTML(item.title || "News")}</a>
            <div class="result-url">${escapeHTML(item.source || hostFromURL(link))}</div>
            ${item.snippet ? `<div class="result-desc">${escapeHTML(item.snippet)}</div>` : ""}
            ${item.date ? `<div class="result-meta">${escapeHTML(item.date)}</div>` : ""}
          </div>
          ${image ? `<img class="thumb" src="${escapeHTML(image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
        </div>
      </article>
    `;
  }).join("");
}

function renderContent(data) {
  const tabs = renderTabs(data);

  if (state.type === "images") {
    const images = renderImages(data);
    return tabs + (images || `<div class="status">No image results were returned.</div>`);
  }

  if (state.type === "videos") {
    const videos = renderVideos(data);
    return tabs + (videos || `<div class="status">No video results were returned.</div>`);
  }

  if (state.type === "news") {
    return tabs + renderSpecialCards(data) + renderNews(data);
  }

  return tabs
    + renderSpecialCards(data)
    + renderMap(data)
    + renderWebResults(getResults(data));
}

function render(data) {
  resultsArea.innerHTML = renderContent(data);

  resultsArea.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      state.type = tab.dataset.type;
      render(state.data);
    });
  });
}

async function performSearch(query, type = "web") {
  query = query.trim();
  if (!query) return;

  state.query = query;
  state.type = type;
  setLoading(true);
  showStatus("Searching…");

  try {
    const url = new URL(API_URL);
    url.searchParams.set("engine", "google");
    url.searchParams.set("q", query);
    url.searchParams.set("google_domain", "google.com");
    url.searchParams.set("hl", "en");
    url.searchParams.set("gl", "us");
    url.searchParams.set("num", "100");
    url.searchParams.set("api_key", API_KEY);

    const response = await fetch(url.href);

    let data;
    try {
      data = await response.json();
    } catch {
      throw new Error("The search service returned an invalid response.");
    }

    if (!response.ok || data.error) {
      throw new Error(data.error || "Search failed.");
    }

    /*
      Normalize direct SerpApi responses into the same structure
      used by the richer Worker version.
    */
    data.results = Array.isArray(data.organic_results)
      ? data.organic_results.map(item => ({
          title: item.title || "",
          url: item.link || "",
          description: item.snippet || "",
          displayUrl: item.displayed_link || item.source || item.link || "",
          thumbnail: item.thumbnail || null,
          source: item.source || "",
          date: item.date || ""
        }))
      : [];

    data.features = data.features || {};

    if (data.finance_results) data.features.finance = data.finance_results;
    if (Array.isArray(data.local_results)) data.features.local = data.local_results;
    if (data.knowledge_graph) data.features.knowledgeGraph = data.knowledge_graph;
    if (data.answer_box) data.features.answerBox = data.answer_box;
    if (data.calculator_result) data.features.calculator = data.calculator_result;
    if (data.weather_result) data.features.weather = data.weather_result;
    if (data.sports_results) data.features.sports = data.sports_results;
    if (Array.isArray(data.events_results)) data.features.events = data.events_results;
    if (Array.isArray(data.shopping_results)) data.features.shopping = data.shopping_results;
    if (Array.isArray(data.images_results)) data.features.images = data.images_results;
    if (Array.isArray(data.video_results)) data.features.videos = data.video_results;
    if (Array.isArray(data.videos_results)) data.features.videos = data.videos_results;
    if (Array.isArray(data.news_results)) data.features.news = data.news_results;

    const local = Array.isArray(data.local_results) ? data.local_results.filter(place => {
      const gps = place?.gps_coordinates;
      return (
        (gps && Number.isFinite(Number(gps.latitude)) && Number.isFinite(Number(gps.longitude))) ||
        (typeof place?.address === "string" && place.address.trim())
      );
    }) : [];

    data.features.map = {
      available: local.length > 0,
      results: local
    };

    data.featureAvailability = {
      finance: !!data.finance_results,
      local: Array.isArray(data.local_results) && data.local_results.length > 0,
      knowledgeGraph: !!data.knowledge_graph,
      answerBox: !!data.answer_box,
      calculator: !!data.calculator_result,
      weather: !!data.weather_result,
      sports: !!data.sports_results,
      events: Array.isArray(data.events_results) && data.events_results.length > 0,
      shopping: Array.isArray(data.shopping_results) && data.shopping_results.length > 0,
      images: Array.isArray(data.images_results) && data.images_results.length > 0,
      videos: (Array.isArray(data.video_results) && data.video_results.length > 0) ||
              (Array.isArray(data.videos_results) && data.videos_results.length > 0),
      news: Array.isArray(data.news_results) && data.news_results.length > 0,
      map: local.length > 0,
      graph: !!data.finance_results
    };

    state.data = data;
    render(data);

  } catch (error) {
    state.data = null;
    showStatus(error.message || "Something went wrong.", true);
  } finally {
    setLoading(false);
  }
}

searchForm.addEventListener("submit", event => {
  event.preventDefault();
  performSearch(searchInput.value);
  suggestions.style.display = "none";
});

searchInput.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    suggestions.style.display = "none";
  }
});

searchInput.addEventListener("input", () => {
  suggestions.style.display = "none";
});

window.addEventListener("pageshow", () => {
  searchInput.focus({ preventScroll: true });
});
</script>
</body>
</html>
