<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --surface: #f7f8fa;
  --surface2: #ffffff;
  --text: #171717;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --danger: #dc2626;
  --shadow: 0 8px 30px rgba(0,0,0,.07);
}

html.dark {
  --bg: #101114;
  --surface: #17181c;
  --surface2: #1c1e23;
  --text: #f4f4f5;
  --muted: #a1a1aa;
  --border: #2b2e35;
  --accent: #60a5fa;
  --accent-hover: #93c5fd;
  --danger: #f87171;
  --shadow: 0 8px 30px rgba(0,0,0,.3);
}

html.light {
  color-scheme: light;
}

html.dark {
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.header {
  width: 100%;
  padding: 18px 24px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.theme-box {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
}

.theme-box select {
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  border-radius: 9px;
  padding: 7px 30px 7px 10px;
  outline: none;
}

.hero {
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: min-height .25s ease;
}

body.has-results .hero {
  min-height: auto;
  padding-top: 55px;
  padding-bottom: 25px;
}

.logo {
  font-size: 62px;
  line-height: 1;
  margin-bottom: 20px;
  user-select: none;
}

.search-wrap {
  width: min(720px, 94vw);
  position: relative;
}

.search-box {
  width: 100%;
  height: 58px;
  display: flex;
  align-items: center;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 30px;
  box-shadow: var(--shadow);
  padding: 0 10px 0 20px;
  transition: border-color .15s, box-shadow .15s;
}

.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 8px 35px rgba(37,99,235,.12);
}

.search-icon {
  font-size: 20px;
  margin-right: 11px;
  opacity: .65;
}

#query {
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 17px;
  min-width: 0;
}

#query::placeholder {
  color: var(--muted);
}

.search-button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  font-size: 19px;
  display: grid;
  place-items: center;
  transition: transform .15s, background .15s;
}

.search-button:hover {
  background: var(--accent-hover);
  transform: scale(1.04);
}

.search-button:disabled {
  opacity: .6;
  cursor: default;
  transform: none;
}

.hint {
  margin-top: 13px;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}

.results-area {
  width: min(1000px, 94vw);
  margin: 0 auto 70px;
}

.status {
  text-align: center;
  padding: 25px;
  color: var(--muted);
}

.error {
  border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border));
  background: color-mix(in srgb, var(--danger) 7%, var(--surface2));
  color: var(--danger);
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 20px;
}

.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  margin-bottom: 25px;
  scrollbar-width: thin;
}

.tab {
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 11px 16px;
  border-bottom: 2px solid transparent;
}

.tab:hover {
  color: var(--text);
}

.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.result {
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}

.result-url {
  color: #15803d;
  font-size: 13px;
  word-break: break-all;
  margin-bottom: 5px;
}

html.dark .result-url {
  color: #86efac;
}

.result-title {
  margin: 0 0 6px;
  font-size: 20px;
  font-weight: 600;
}

.result-title a {
  color: var(--accent);
  text-decoration: none;
}

.result-title a:hover {
  text-decoration: underline;
}

.result-description {
  color: var(--muted);
  line-height: 1.55;
  font-size: 14px;
}

.result-date {
  color: var(--muted);
  font-size: 12px;
  margin-top: 7px;
}

.card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,.025);
}

.card-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}

.answer {
  line-height: 1.65;
}

.answer-source {
  margin-top: 12px;
  font-size: 13px;
}

.answer-source a {
  color: var(--accent);
}

.kg-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 5px;
}

.kg-subtitle {
  color: var(--muted);
  margin-bottom: 12px;
}

.kg-description {
  line-height: 1.6;
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.feature-item {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
}

.feature-label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 5px;
}

.feature-value {
  font-weight: 600;
}

.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
}

.media-card {
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  background: var(--surface);
}

.media-card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  display: block;
}

.media-info {
  padding: 11px;
}

.media-info a {
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
}

.media-info a:hover {
  color: var(--accent);
}

.news-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.news-item:last-child {
  border-bottom: 0;
}

.news-item a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 650;
}

.news-source {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

.related {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.related button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 20px;
  padding: 8px 13px;
}

.related button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  padding: 35px;
  color: var(--muted);
}

.spinner {
  width: 19px;
  height: 19px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 25px;
}

.hidden {
  display: none !important;
}

@media (max-width: 600px) {
  .header {
    padding: 13px 15px;
  }

  .logo {
    font-size: 54px;
  }

  .search-box {
    height: 54px;
  }

  .result-title {
    font-size: 18px;
  }

  body.has-results .hero {
    padding-top: 25px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="theme-box">
    <span>Theme</span>
    <select id="themeSelect" aria-label="Theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
</header>

<main>

<section class="hero">
  <div class="logo">🔍</div>

  <form class="search-wrap" id="searchForm">
    <div class="search-box">
      <span class="search-icon">🔍</span>

      <input
        id="query"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web..."
        aria-label="Search"
      >

      <button
        id="searchButton"
        class="search-button"
        type="submit"
        aria-label="Search"
      >➜</button>
    </div>

    <div class="hint">
      Press Enter to search
    </div>
  </form>
</section>

<section class="results-area">

  <div id="status"></div>

  <div id="tabs" class="tabs hidden"></div>

  <div id="content"></div>

</section>

</main>

<footer class="footer">
  Search
</footer>

<script>
/*
==========================================================
DIRECT GOOGLE SEARCH BACKEND
==========================================================

This app now fetches results directly from Google via
a backend server. No external API keys needed.

Run: node server.js
Then access the app in your browser.
==========================================================
*/

const BACKEND_URL = "http://localhost:3000/api/search";

const queryInput = document.getElementById("query");
const searchForm = document.getElementById("searchForm");
const searchButton = document.getElementById("searchButton");
const statusBox = document.getElementById("status");
const tabsBox = document.getElementById("tabs");
const contentBox = document.getElementById("content");
const themeSelect = document.getElementById("themeSelect");

let currentData = null;
let currentTab = "web";

const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

function applyTheme(theme) {
  document.documentElement.classList.remove("light", "dark");

  if (theme === "dark") {
    document.documentElement.classList.add("dark");
  } else if (theme === "light") {
    document.documentElement.classList.add("light");
  } else {
    document.documentElement.classList.add(
      mediaQuery.matches ? "dark" : "light"
    );
  }
}

const savedTheme = localStorage.getItem("search-theme") || "system";

themeSelect.value = savedTheme;
applyTheme(savedTheme);

mediaQuery.addEventListener("change", () => {
  if (themeSelect.value === "system") {
    applyTheme("system");
  }
});

themeSelect.addEventListener("change", () => {
  const theme = themeSelect.value;

  localStorage.setItem("search-theme", theme);
  applyTheme(theme);
});

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function safeURL(value) {
  if (!value) return "#";

  try {
    const urlObj = new URL(value);

    if (
      urlObj.protocol === "http:" ||
      urlObj.protocol === "https:"
    ) {
      return urlObj.href;
    }
  } catch (_) {}

  return "#";
}

function domainFromURL(value) {
  try {
    return new URL(value).hostname;
  } catch (_) {
    return "";
  }
}

function textValue(value) {
  if (typeof value === "string") return value;

  if (typeof value === "number") {
    return String(value);
  }

  if (value && typeof value === "object") {
    if (value.text) return String(value.text);
    if (value.answer) return String(value.answer);
    if (value.title) return String(value.title);
  }

  return "";
}

function showLoading() {
  statusBox.innerHTML = `
    <div class="loading">
      <span class="spinner"></span>
      <span>Searching...</span>
    </div>
  `;

  contentBox.innerHTML = "";
  tabsBox.classList.add("hidden");
}

function showError(message) {
  statusBox.innerHTML = `
    <div class="error">
      <strong>Search failed</strong>
      <div style="margin-top:6px">${escapeHTML(message)}</div>
    </div>
  `;

  tabsBox.classList.add("hidden");
  contentBox.innerHTML = "";
}

function clearStatus() {
  statusBox.innerHTML = "";
}

function renderWebResults(data) {
  if (!Array.isArray(data.organic_results)) {
    return "<p>No results found</p>";
  }

  return data.organic_results
    .map(result => `
      <div class="result">
        <div class="result-url">
          ${escapeHTML(domainFromURL(result.link))}
        </div>
        <h2 class="result-title">
          <a
            href="${safeURL(result.link)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHTML(result.title)}
          </a>
        </h2>
        <div class="result-description">
          ${escapeHTML(result.snippet || '')}
        </div>
      </div>
    `)
    .join("");
}

function renderCurrentTab() {
  if (!currentData) return;

  switch (currentTab) {
    case "web":
      contentBox.innerHTML = renderWebResults(currentData);
      break;
    default:
      contentBox.innerHTML = "<p>Tab content not available</p>";
  }
}

async function performSearch(query) {
  if (!query.trim()) {
    showError("Please enter a search query");
    return;
  }

  showLoading();
  document.body.classList.add("has-results");

  try {
    const response = await fetch(
      `${BACKEND_URL}?q=${encodeURIComponent(query)}`
    );

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (data.error) {
      showError(data.message || data.error);
      return;
    }

    currentData = data;
    currentTab = "web";
    clearStatus();
    renderCurrentTab();
    queryInput.value = query;
  } catch (error) {
    showError(
      error.message === "Failed to fetch"
        ? "Make sure the backend server is running (node server.js)"
        : error.message
    );
    document.body.classList.remove("has-results");
  }
}

searchForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const query = queryInput.value.trim();
  performSearch(query);
});

// Check if params in URL for direct search
const params = new URLSearchParams(window.location.search);
if (params.has("q")) {
  const q = params.get("q");
  queryInput.value = q;
  performSearch(q);
}
</script>
</body>
</html>
