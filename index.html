<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Search</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #ffffff;
  --text: #202124;
  --muted: #5f6368;
  --border: #dadce0;
  --card: #ffffff;
  --hover: #f8f9fa;
  --accent: #1a73e8;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202124;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --border: #3c4043;
    --card: #292a2d;
    --hover: #303134;
    --accent: #8ab4f8;
    --shadow: 0 2px 8px rgba(0,0,0,.25);
  }
}

html[data-theme="light"] {
  --bg: #ffffff;
  --text: #202124;
  --muted: #5f6368;
  --border: #dadce0;
  --card: #ffffff;
  --hover: #f8f9fa;
  --accent: #1a73e8;
}

html[data-theme="dark"] {
  --bg: #202124;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --border: #3c4043;
  --card: #292a2d;
  --hover: #303134;
  --accent: #8ab4f8;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .2s, color .2s;
}

header {
  padding: 22px 20px 10px;
  text-align: center;
}

.logo {
  font-size: 44px;
  margin-bottom: 12px;
}

.search-area {
  width: min(760px, 94%);
  margin: auto;
}

.search-box {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 4px 8px 4px 16px;
  background: var(--card);
  box-shadow: var(--shadow);
}

.search-box:focus-within {
  border-color: var(--accent);
}

.search-box input {
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 17px;
  padding: 12px 8px;
}

.search-button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 22px;
  cursor: pointer;
  padding: 8px 12px;
}

.search-button:hover {
  color: var(--accent);
}

.controls {
  width: min(900px, 94%);
  margin: 20px auto 0;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.tab {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 20px;
  padding: 8px 16px;
  cursor: pointer;
}

.tab.active,
.tab:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.settings {
  width: min(900px, 94%);
  margin: 12px auto;
  text-align: right;
}

.settings select {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
}

#status {
  width: min(900px, 94%);
  margin: 20px auto;
  color: var(--muted);
  text-align: center;
}

#results {
  width: min(900px, 94%);
  margin: 0 auto 60px;
}

.result {
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}

.result-url {
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.result h2 {
  margin: 5px 0;
  font-size: 21px;
  font-weight: 500;
}

.result h2 a {
  color: var(--accent);
  text-decoration: none;
}

.result h2 a:hover {
  text-decoration: underline;
}

.result p {
  margin: 6px 0;
  line-height: 1.5;
}

.date {
  color: var(--muted);
  font-size: 13px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin: 18px 0;
  box-shadow: var(--shadow);
}

.card h3 {
  margin-top: 0;
}

.answer {
  font-size: 20px;
  line-height: 1.5;
}

.knowledge-title {
  font-size: 24px;
  margin-bottom: 8px;
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}

.feature-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
}

.feature-card h3 {
  margin-top: 0;
}

.images-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}

.image-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--card);
}

.image-card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  display: block;
}

.image-card div {
  padding: 10px;
  font-size: 14px;
}

.video-list {
  display: grid;
  gap: 12px;
}

.video-item {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.video-item a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.map-list {
  display: grid;
  gap: 10px;
}

.map-place {
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.map-place a {
  color: var(--accent);
}

.related a {
  display: block;
  padding: 8px 0;
  color: var(--accent);
  text-decoration: none;
}

.loading {
  padding: 35px;
  text-align: center;
}

.error {
  color: #d93025;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

@media (max-width: 600px) {
  .logo {
    font-size: 36px;
  }

  .result h2 {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🔍</div>

  <div class="search-area">
    <form class="search-box" id="searchForm">
      <input
        id="query"
        type="search"
        placeholder="Search the web"
        autocomplete="off"
        spellcheck="false"
        required
      >
      <button class="search-button" type="submit" aria-label="Search">🔍</button>
    </form>
  </div>
</header>

<div class="controls">
  <button class="tab active" data-type="web">Web</button>
  <button class="tab" data-type="images">Images</button>
  <button class="tab" data-type="news">News</button>
  <button class="tab" data-type="videos">Videos</button>
</div>

<div class="settings">
  <label>
    Theme:
    <select id="theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
</div>

<div id="status"></div>
<main id="results"></main>

<script>
/* =========================================================
   API KEY
   ========================================================= */

const API_KEY = "ezGeMU9TnuXNnmytZSSScsbL";


/* =========================================================
   API
   ========================================================= */

const API_URL = "https://serpapi.com/search";


/* =========================================================
   THEME
   ========================================================= */

const themeSelect = document.getElementById("theme");

function applyTheme(theme) {
  if (theme === "system") {
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", theme);
  }
}

const savedTheme = localStorage.getItem("search-theme") || "system";

themeSelect.value = savedTheme;
applyTheme(savedTheme);

themeSelect.addEventListener("change", () => {
  const theme = themeSelect.value;

  localStorage.setItem("search-theme", theme);
  applyTheme(theme);
});


/* =========================================================
   ELEMENTS
   ========================================================= */

const form = document.getElementById("searchForm");
const queryInput = document.getElementById("query");
const resultsEl = document.getElementById("results");
const statusEl = document.getElementById("status");

let currentType = "web";
let lastData = null;
let lastQuery = "";


/* =========================================================
   TABS
   ========================================================= */

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {

    document.querySelectorAll(".tab").forEach(b => {
      b.classList.remove("active");
    });

    button.classList.add("active");

    currentType = button.dataset.type;

    if (lastData) {
      renderData(lastData, currentType);
    }
  });
});


/* =========================================================
   SECURITY HELPERS
   ========================================================= */

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function safeURL(value) {
  try {
    const url = new URL(value);

    if (
      url.protocol === "http:" ||
      url.protocol === "https:"
    ) {
      return url.href;
    }

    return "#";
  } catch {
    return "#";
  }
}


/* =========================================================
   SEARCH
   ========================================================= */

form.addEventListener("submit", event => {
  event.preventDefault();

  const query = queryInput.value.trim();

  if (!query) return;

  performSearch(query);
});


async function performSearch(query) {

  lastQuery = query;

  resultsEl.innerHTML = `
    <div class="loading">
      Searching…
    </div>
  `;

  statusEl.textContent = "";

  try {

    const params = new URLSearchParams();

    params.set("engine", "google");
    params.set("q", query);
    params.set("google_domain", "google.com");
    params.set("hl", "en");
    params.set("gl", "us");

    /*
      100 means "request up to 100".
      SerpApi decides how many Google results are actually available.
      This remains ONE API request.
    */
    params.set("num", "100");

    params.set("api_key", API_KEY);

    const response = await fetch(
      API_URL + "?" + params.toString(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        "The API returned an invalid response."
      );
    }

    if (!response.ok || data.error) {
      throw new Error(
        data.error ||
        "The search API returned an error."
      );
    }

    lastData = data;

    renderData(data, currentType);

  } catch (error) {

    console.error(error);

    resultsEl.innerHTML = `
      <div class="card error">
        <h3>Search failed</h3>
        <p>${escapeHTML(error.message)}</p>
        <p>
          If this page is being opened directly as a
          <code>file://</code> file, open it through an HTTPS
          website instead.
        </p>
      </div>
    `;

    statusEl.textContent = "";
  }
}


/* =========================================================
   MAIN RENDERER
   ========================================================= */

function renderData(data, type) {

  resultsEl.innerHTML = "";

  if (type === "images") {
    renderImages(data);
    return;
  }

  if (type === "news") {
    renderNews(data);
    return;
  }

  if (type === "videos") {
    renderVideos(data);
    return;
  }

  renderWeb(data);
}


/* =========================================================
   WEB
   ========================================================= */

function renderWeb(data) {

  const featureContainer = document.createElement("div");

  renderSpecialFeatures(data, featureContainer);

  resultsEl.appendChild(featureContainer);

  const results =
    Array.isArray(data.organic_results)
      ? data.organic_results
      : [];

  if (!results.length) {

    if (!featureContainer.innerHTML) {
      resultsEl.innerHTML = `
        <div class="card">
          No web results were returned.
        </div>
      `;
    }

    return;
  }

  const heading = document.createElement("div");

  heading.innerHTML = `
    <p style="color:var(--muted)">
      Web results for
      <strong>${escapeHTML(lastQuery)}</strong>
    </p>
  `;

  resultsEl.appendChild(heading);

  for (const item of results) {

    const link = safeURL(item.link);

    const div = document.createElement("article");

    div.className = "result";

    div.innerHTML = `
      <div class="result-url">
        ${escapeHTML(item.displayed_link || item.link || "")}
      </div>

      <h2>
        <a href="${link}" target="_blank" rel="noopener noreferrer">
          ${escapeHTML(item.title || "Untitled")}
        </a>
      </h2>

      <p>
        ${escapeHTML(item.snippet || "")}
      </p>

      ${
        item.date
          ? `<div class="date">${escapeHTML(item.date)}</div>`
          : ""
      }
    `;

    resultsEl.appendChild(div);
  }

  renderRelated(data);
}


/* =========================================================
   SPECIAL FEATURES
   ========================================================= */

function renderSpecialFeatures(data, container) {

  let added = false;

  /* Answer box */

  if (data.answer_box) {

    const box = data.answer_box;

    let answer =
      box.answer ||
      box.snippet ||
      box.result ||
      "";

    if (answer) {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <h3>Answer</h3>
        <div class="answer">
          ${escapeHTML(answer)}
        </div>
      `;

      container.appendChild(card);

      added = true;
    }
  }


  /* Knowledge graph */

  if (data.knowledge_graph) {

    const kg = data.knowledge_graph;

    const title =
      kg.title ||
      kg.name ||
      "";

    const description =
      kg.description ||
      kg.type ||
      "";

    if (title || description) {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <div class="knowledge-title">
          ${escapeHTML(title)}
        </div>

        ${
          description
            ? `<p>${escapeHTML(description)}</p>`
            : ""
        }

        ${
          kg.website
            ? `
              <p>
                <a
                  href="${safeURL(kg.website)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Official website
                </a>
              </p>
            `
            : ""
        }
      `;

      container.appendChild(card);

      added = true;
    }
  }


  /* Calculator */

  if (data.calculator_result) {

    const value =
      typeof data.calculator_result === "object"
        ? data.calculator_result.result
        : data.calculator_result;

    if (value !== undefined && value !== null) {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <h3>Calculator</h3>
        <div class="answer">
          ${escapeHTML(value)}
        </div>
      `;

      container.appendChild(card);

      added = true;
    }
  }


  /* Weather */

  if (data.weather_result) {

    const weather = data.weather_result;

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h3>Weather</h3>

      <div class="feature-grid">

        ${
          weather.temperature !== undefined
            ? `
              <div class="feature-card">
                <strong>Temperature</strong>
                <div>
                  ${escapeHTML(weather.temperature)}
                  ${escapeHTML(weather.unit || "")}
                </div>
              </div>
            `
            : ""
        }

        ${
          weather.condition
            ? `
              <div class="feature-card">
                <strong>Condition</strong>
                <div>${escapeHTML(weather.condition)}</div>
              </div>
            `
            : ""
        }

        ${
          weather.location
            ? `
              <div class="feature-card">
                <strong>Location</strong>
                <div>${escapeHTML(weather.location)}</div>
              </div>
            `
            : ""
        }

      </div>
    `;

    container.appendChild(card);

    added = true;
  }


  /* Finance */

  if (Array.isArray(data.finance_results) &&
      data.finance_results.length) {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `<h3>Finance</h3>`;

    const grid = document.createElement("div");

    grid.className = "feature-grid";

    for (const item of data.finance_results) {

      const symbol =
        item.symbol ||
        item.ticker ||
        "";

      const name =
        item.name ||
        item.title ||
        "";

      const price =
        item.price ??
        item.price_text ??
        "";

      const change =
        item.change ??
        item.change_percentage ??
        "";

      const box = document.createElement("div");

      box.className = "feature-card";

      box.innerHTML = `
        <h3>${escapeHTML(name || symbol)}</h3>

        ${
          price !== ""
            ? `<div class="answer">${escapeHTML(price)}</div>`
            : ""
        }

        ${
          change !== ""
            ? `<p>${escapeHTML(change)}</p>`
            : ""
        }
      `;

      grid.appendChild(box);
    }

    card.appendChild(grid);
    container.appendChild(card);

    added = true;
  }


  /* Local results / maps */

  if (Array.isArray(data.local_results) &&
      data.local_results.length) {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `<h3>Places</h3>`;

    const list = document.createElement("div");

    list.className = "map-list";

    for (const place of data.local_results) {

      const name =
        place.title ||
        place.name ||
        "Place";

      const address =
        place.address ||
        "";

      let mapsURL = "";

      if (
        typeof place.gps_coordinates === "object" &&
        place.gps_coordinates
      ) {

        const lat = place.gps_coordinates.latitude;
        const lon = place.gps_coordinates.longitude;

        if (
          typeof lat === "number" &&
          typeof lon === "number"
        ) {
          mapsURL =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(lat + "," + lon);
        }
      }

      if (!mapsURL) {

        mapsURL =
          "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(
            name + " " + address
          );
      }

      const item = document.createElement("div");

      item.className = "map-place";

      item.innerHTML = `
        <strong>${escapeHTML(name)}</strong>

        ${
          address
            ? `<div>${escapeHTML(address)}</div>`
            : ""
        }

        <div style="margin-top:8px">
          <a
            href="${safeURL(mapsURL)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open in Maps
          </a>
        </div>
      `;

      list.appendChild(item);
    }

    card.appendChild(list);
    container.appendChild(card);

    added = true;
  }

  return added;
}


/* =========================================================
   IMAGES
   ========================================================= */

function renderImages(data) {

  const images =
    Array.isArray(data.images_results)
      ? data.images_results
      : [];

  if (!images.length) {

    resultsEl.innerHTML = `
      <div class="card">
        No image results were returned.
      </div>
    `;

    return;
  }

  const heading = document.createElement("div");

  heading.innerHTML = `
    <p style="color:var(--muted)">
      Images for
      <strong>${escapeHTML(lastQuery)}</strong>
    </p>
  `;

  resultsEl.appendChild(heading);

  const grid = document.createElement("div");

  grid.className = "images-grid";

  for (const image of images) {

    const imageURL =
      safeURL(
        image.original ||
        image.thumbnail ||
        ""
      );

    const sourceURL =
      safeURL(
        image.link ||
        image.source ||
        ""
      );

    if (imageURL === "#") continue;

    const card = document.createElement("div");

    card.className = "image-card";

    card.innerHTML = `
      <a
        href="${imageURL}"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="${imageURL}"
          loading="lazy"
          alt="${escapeHTML(image.title || "")}"
          onerror="this.parentElement.parentElement.style.display='none'"
        >
      </a>

      <div>
        ${
          image.title
            ? `<div>${escapeHTML(image.title)}</div>`
            : ""
        }

        ${
          sourceURL !== "#"
            ? `
              <div style="margin-top:6px">
                <a
                  href="${sourceURL}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Source
                </a>
              </div>
            `
            : ""
        }
      </div>
    `;

    grid.appendChild(card);
  }

  resultsEl.appendChild(grid);
}


/* =========================================================
   NEWS
   ========================================================= */

function renderNews(data) {

  const news =
    Array.isArray(data.news_results)
      ? data.news_results
      : (
          Array.isArray(data.top_stories)
            ? data.top_stories
            : []
        );

  if (!news.length) {

    resultsEl.innerHTML = `
      <div class="card">
        No news results were returned.
      </div>
    `;

    return;
  }

  for (const item of news) {

    const link =
      safeURL(
        item.link ||
        item.url ||
        ""
      );

    const div = document.createElement("article");

    div.className = "result";

    div.innerHTML = `
      <div class="result-url">
        ${escapeHTML(
          item.source ||
          item.publisher ||
          ""
        )}
      </div>

      <h2>
        <a
          href="${link}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${escapeHTML(
            item.title ||
            "News article"
          )}
        </a>
      </h2>

      <p>
        ${escapeHTML(
          item.snippet ||
          item.description ||
          ""
        )}
      </p>

      ${
        item.date
          ? `<div class="date">${escapeHTML(item.date)}</div>`
          : ""
      }
    `;

    resultsEl.appendChild(div);
  }
}


/* =========================================================
   VIDEOS
   ========================================================= */

function renderVideos(data) {

  const videos =
    Array.isArray(data.video_results)
      ? data.video_results
      : (
          Array.isArray(data.videos_results)
            ? data.videos_results
            : []
        );

  if (!videos.length) {

    resultsEl.innerHTML = `
      <div class="card">
        No video results were returned.
      </div>
    `;

    return;
  }

  const list = document.createElement("div");

  list.className = "video-list";

  for (const item of videos) {

    const link =
      safeURL(
        item.link ||
        item.url ||
        ""
      );

    const div = document.createElement("div");

    div.className = "video-item";

    div.innerHTML = `
      <a
        href="${link}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ${escapeHTML(
          item.title ||
          "Video"
        )}
      </a>

      ${
        item.snippet
          ? `<p>${escapeHTML(item.snippet)}</p>`
          : ""
      }

      ${
        item.channel
          ? `<small>${escapeHTML(item.channel)}</small>`
          : ""
      }
    `;

    list.appendChild(div);
  }

  resultsEl.appendChild(list);
}


/* =========================================================
   RELATED SEARCHES
   ========================================================= */

function renderRelated(data) {

  if (
    !Array.isArray(data.related_searches) ||
    !data.related_searches.length
  ) {
    return;
  }

  const card = document.createElement("div");

  card.className = "card related";

  card.innerHTML = `<h3>Related searches</h3>`;

  for (const item of data.related_searches) {

    const query =
      typeof item === "string"
        ? item
        : item.query || "";

    if (!query) continue;

    const button = document.createElement("a");

    button.href = "#";

    button.textContent = query;

    button.addEventListener("click", event => {

      event.preventDefault();

      queryInput.value = query;

      performSearch(query);
    });

    card.appendChild(button);
  }

  resultsEl.appendChild(card);
}


/* =========================================================
   SYSTEM THEME AUTO-UPDATE
   ========================================================= */

const systemTheme =
  window.matchMedia("(prefers-color-scheme: dark)");

systemTheme.addEventListener("change", () => {

  const selected =
    localStorage.getItem("search-theme") ||
    "system";

  if (selected === "system") {
    applyTheme("system");
  }
});

queryInput.focus();
